YAML

name: Build C 30 Fashions APK

'on':
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          if [ -f settings.gradle.kts ]; then
            PROJECT_DIR="."
          elif [ -f SmartBizAndroidStarter/settings.gradle.kts ]; then
            PROJECT_DIR="SmartBizAndroidStarter"
          else
            echo "Android project files not found"
            exit 1
          fi
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: C-30-Fashions-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 14
          
